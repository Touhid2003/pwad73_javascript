<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const zoo= new Array(" Zebras"," Lions", " Apes"," Tigers");
        document.write(zoo + "<br>" + "<br>");
        const part = zoo.slice(2,4);
       document.write(part + "<br>" + "<br>");

        const numbers = new Array(10, 15, 12, 22, 1);
        document.write(numbers + "<br>" + "<br>");
        const parts = numbers.slice(1,3);
        document.write(parts + "<br>" + "<br>");

        const numbers3 = new Array(10, 15, 12, 22, 1);
        document.write(numbers3 + "<br>" + "<br>");
        const parts1 = numbers.slice(-1);
        document.write(parts1);

        

        

    </script>
</body>
</html>
