<body>
    <script>
        function isPrime(n){
            if(n===1){
                return "Not a prime Number";
            }
            else if(n ===2){
                return + "Not prime number";

            }
            else{
                for(let x =2; x<n; x++){
                    if(n % x === 0){
                        return "Not a prime number: ";
                    }
                    
                }
                return n + "is a prime number";
            }
        }

        document.write(isPrime(11));
    </script>
