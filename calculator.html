<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Javascript</title>
     <script>
        function add(a,b){
            return a + b;
        }
        function subNumber(a,b){
            return a - b;
        }
        

    </script>
</head>
<body>

    <script>
         let sum1 = add(4,5);
          let sub = subNumber(8, 1);
         
         document.write(sum1 + "<br>");
         document.write(sub);
    </script>

   
    
</body>
</html>
