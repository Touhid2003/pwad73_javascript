<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function oddEvent()
        {
            let num = prompt("Enter your number: ");
            num = parseInt(num)

            if(num%2==0){
                alert ( num +  " is Event");
            }
            else{
                alert ( num + " is odd");
            }
        }
    </script>
</head>
<body>
    <button onclick="oddEvent()" >Click</button>
    
</body>
</html>
